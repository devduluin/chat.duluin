services:
  duluin-chat-frontend-prod:
    container_name: duluin-chat-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_NODE_ENV=production
        - NEXT_PUBLIC_API_BASE_URL=http://next:3000
        - NEXT_PUBLIC_APP_NAME=Duluin Chat Prod
        - NEXT_PUBLIC_AUTH_API_URL=https://sso.duluin.com/api
        - NEXT_PUBLIC_GATEWAY_API_URL=https://sso.duluin.com/api
        - NEXT_PUBLIC_GATEWAY_API_URL_PROD=https://api-hrms.duluin.com/api/proxy/v1/chat
        # - NEXT_PUBLIC_GATEWAY_API_URL_DEV=http://76.13.17.180:3900/api/v1
        - NEXT_PUBLIC_GATEWAY_API_URL_DEV=https://api-hrms.duluin.com/api/proxy/v1/chat
        # WebSocket Gateway URL (untuk real-time chat)
        - NEXT_PUBLIC_WS_GATEWAY_URL=https://api-hrms.duluin.com/api/ws/v1/chat
        - NEXT_PUBLIC_NLP_GATEWAY_URL=https://api-hrms.duluin.com/api/proxy/v1/chat
        - NEXT_PUBLIC_WORKSPACE_URL=/
        - NEXT_PUBLIC_NLP_SERVICE_URL=https://api-hrms.duluin.com/api/proxy/v1/nlp
        - NEXT_PUBLIC_EMPLOYEE_API_URL=https://api-hrms.duluin.com/api/proxy/v1/employees
        - NEXT_PUBLIC_APP_URL_WORKSPACE=https://launchpad.duluin.id
    ports:
      - "8085:8085" # TODO: Sesuaikan port production jika berbeda
    environment:
      - NODE_ENV=production
      - PORT=8085
    restart: unless-stopped
    networks:
      - duluin-network
      - apigateway_internal_network
      - hriscompanies_hris_network

networks:
  duluin-network:
    driver: bridge
  apigateway_internal_network:
    external: true
  hriscompanies_hris_network:
    external: true
